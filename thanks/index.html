  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ════════════════════════════════════════════════════════════════════
       GOOGLE ADS CONVERSION TRACKING  —  EVAN: READ THIS

       This fires a conversion the moment a lead lands here (i.e. right
       after they submit the Jobber form). That is the signal Google's
       algorithm optimizes against.

       BEFORE THIS WORKS YOU MUST DO 2 THINGS IN GOOGLE ADS:

       1. Tools → Conversions → + New conversion action → Website
          → set up MANUALLY (not via tag setup wizard).
          - Category:        "Submit lead form"
          - Conversion name: "Lead Form — rushesmedia.com"
          - Value:           Use the same value for each ($1) is fine to start.
                             (Real money value gets fed later via offline import.)
          - Count:           "One" (not "Every")

       2. Google gives you two values: a Conversion ID (AW-XXXXXXXXXX)
          and a Conversion Label (a short string). Paste them below where
          it says REPLACE_ME. Then redeploy the site.

       Until you do step 2, this page works fine for the user but
       reports ZERO conversions to Google. Do not launch spend before
       this is live with the real IDs.
       ════════════════════════════════════════════════════════════════════ -->

  <!-- Meta pixel — fires Lead automatically on this page once ID is set in /assets/meta-pixel.js -->
  <script src="/assets/meta-pixel.js" defer></script>

  <!-- Google tag (gtag.js) -->
  <script>
    const analyticsHost = window.location.hostname.toLowerCase();
    const suppressLocalAnalytics = ['localhost', '127.0.0.1', '[::1]'].includes(analyticsHost) || analyticsHost.endsWith('.test');
    const adsConversionId = 'AW-REPLACE_ME'; // stays dormant until a real Google Ads conversion ID replaces the placeholder
    if (!suppressLocalAnalytics && !adsConversionId.includes('REPLACE_ME')) {
      const googleTag = document.createElement('script');
      googleTag.async = true;
      googleTag.src = 'https://www.googletagmanager.com/gtag/js?id=AW-REPLACE_ME';
      document.head.appendChild(googleTag);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ↓↓↓  REPLACE  AW-REPLACE_ME  WITH YOUR REAL CONVERSION ID  ↓↓↓
      gtag('config', 'AW-REPLACE_ME');

      // ↓↓↓  REPLACE BOTH VALUES BELOW WITH YOUR REAL ID + LABEL  ↓↓↓
      gtag('event', 'conversion', {
        'send_to': 'AW-REPLACE_ME/REPLACE_ME_LABEL',
        'value': 1.0,
        'currency': 'USD'
      });
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0c1825;
      color: #f5f0e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    @media (hover: none) { body { cursor: auto; } }

    :root {
      --ink:   #0c1825;
      --navy:  #1a2a3f;
      --cream: #f5f0e6;
      --gold:  #b89860;
      --gold-d:#9a7d4a;
      --px:    clamp(24px, 6vw, 80px);
      --ease:  cubic-bezier(.4,0,.2,1);
    }

    a:focus-visible, button:focus-visible {
      outline: 3px solid #d4b87a;
      outline-offset: 4px;
    }

    #cur {
      position: fixed; z-index: 9999;
      width: 10px; height: 10px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%,-50%);
      transition: width .18s var(--ease), height .18s var(--ease), opacity .18s;
    }
    #cur.big { width: 40px; height: 40px; opacity: .3; }
    @media (hover: none) { #cur { display: none; } }

    /* glow */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 38%, rgba(184,152,96,.10), transparent 70%);
      pointer-events: none;
    }

    header {
      padding: 38px var(--px) 0;
    }
    .logo {
      display: inline-flex; align-items: center; gap: 12px; height: 44px;
    }
    .logo img {
      height: 100%; width: auto;
      filter: brightness(0) invert(1) brightness(0.96) sepia(.08);
    }
    .logo .wm { height: 20px; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px var(--px);
      position: relative;
      z-index: 1;
    }

    .tick {
      width: 64px; height: 64px;
      border: 1px solid rgba(184,152,96,.45);
      border-radius: 50%;
      display: grid; place-items: center;
      margin-bottom: 34px;
      animation: pop .6s var(--ease) both;
    }
    .tick svg { width: 26px; height: 26px; stroke: var(--gold); }
    @keyframes pop {
      0%   { transform: scale(.6); opacity: 0; }
      60%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .eyebrow {
      font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 22px;
      animation: rise .7s var(--ease) .1s both;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1.05;
      letter-spacing: -.01em;
      margin-bottom: 26px;
      animation: rise .7s var(--ease) .18s both;
    }
    h1 em { font-style: italic; color: var(--gold); }
    .sub {
      font-size: clamp(16px, 1.9vw, 19px);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(245,240,230,.72);
      max-width: 540px;
      margin-bottom: 44px;
      animation: rise .7s var(--ease) .26s both;
    }
    .sub strong { color: var(--cream); font-weight: 500; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btns {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
      animation: rise .7s var(--ease) .34s both;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 500;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 17px 34px; border-radius: 2px;
      cursor: none;
      transition: background .2s var(--ease), border-color .2s, transform .2s, color .2s;
    }
    .btn .arr { transition: transform .2s var(--ease); }
    .btn:hover .arr { transform: translateX(4px); }
    .btn-g {
      background: var(--gold); color: var(--ink);
      border: 1px solid var(--gold);
    }
    .btn-g:hover { background: var(--gold-d); border-color: var(--gold-d); transform: translateY(-2px); }
    .btn-o {
      background: transparent; color: var(--cream);
      border: 1px solid rgba(245,240,230,.22);
    }
    .btn-o:hover { border-color: var(--gold); color: var(--gold); }

    footer {
      padding: 30px var(--px);
      text-align: center;
      font-size: 12px;
      letter-spacing: .04em;
      color: rgba(245,240,230,.32);
    }

    @media (max-width: 540px) {
      .btns { flex-direction: column; width: 100%; max-width: 320px; }
      .btn { justify-content: center; width: 100%; }
    }
  </style>
</head>
<body>

<div id="cur"></div>

<header>
  <a href="/" class="logo" aria-label="Rushes Media — home">
    <img src="../assets/images/logo-icon.png" alt="" width="833" height="959" />
    <img src="../assets/images/logo-wordmark.png" alt="Rushes Media" class="wm" width="2888" height="322" />
  </a>
</header>

<main>
  <div class="tick" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </div>

  <p class="eyebrow">{{COPY_EYEBROW}}</p>

  <h1>{{COPY_HEADLINE_LEAD}}<br /><em>{{COPY_HEADLINE_ACCENT}}</em></h1>

  <p class="sub">{{COPY_BODY}}</p>

  <div class="btns">
    <a href="/#book" class="btn btn-g" data-booking-return>
      {{COPY_PRIMARY_CTA}} <span class="arr">→</span>
    </a>
    <a href="/" class="btn btn-o">{{COPY_SECONDARY_CTA}}</a>
  </div>
</main>

<footer>
  © 2026 Rushes Media &nbsp;·&nbsp; South Jersey &nbsp;·&nbsp; Philadelphia &nbsp;·&nbsp; rushesmedia.com
</footer>

<script>
  const bookingReturn = document.querySelector('[data-booking-return]');
  if (bookingReturn) {
    const destination = new URL('/#book', window.location.origin);
    const incoming = new URL(window.location.href);
    for (const key of ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content']) {
      const value = incoming.searchParams.get(key);
      if (value) destination.searchParams.set(key, value.slice(0, 120));
    }
    bookingReturn.href = destination.toString();
  }

  const cur = document.getElementById('cur');
  document.addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
  document.querySelectorAll('a,button').forEach(el => {
    el.addEventListener('mouseenter', () => cur.classList.add('big'));
    el.addEventListener('mouseleave', () => cur.classList.remove('big'));
  });
</script>
<script>
  if (!['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname) && !window.location.hostname.toLowerCase().endsWith('.test')) {
    const tracking = document.createElement('script');
    tracking.src = 'https://link.msgsndr.com/js/external-tracking.js';
    tracking.dataset.trackingId = 'tk_e022859e25cb4ac3901acfffc60cb59a';
    tracking.async = true;
    document.head.appendChild(tracking);
  }
</script>
</body>
</html>
