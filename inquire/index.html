<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquire — Rushes Media</title>
  <meta name="description" content="Tell Rushes Media what you're trying to grow — we'll follow up quickly." />
  <meta name="theme-color" content="#f5f0e6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f0e6;
      color: #1a2a3f;
      min-height: 100vh;
      padding: 48px 24px 64px;
    }
    a { color: #b89860; }
    main { max-width: 560px; margin: 0 auto; }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 6vw, 44px);
      margin-bottom: 12px;
    }
    .sub { color: rgba(26,42,63,.65); line-height: 1.6; margin-bottom: 32px; }
    .lf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .lf-field { display: flex; flex-direction: column; }
    .lf-field.full { grid-column: 1 / -1; }
    label {
      font-size: 11px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(26,42,63,.55);
      margin-bottom: 7px;
    }
    input, textarea {
      font-family: Inter, sans-serif;
      font-size: 15px; color: #1a2a3f;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(26,42,63,.18);
      border-radius: 2px;
      padding: 13px 15px;
      width: 100%;
    }
    textarea { resize: vertical; min-height: 92px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #b89860;
      background: #fff;
    }
    .lf-hp { position: absolute; left: -9999px; opacity: 0; height: 0; width: 0; }
    button {
      font-family: Inter, sans-serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: .08em; text-transform: uppercase;
      background: #1a2a3f; color: #f5f0e6;
      border: none; border-radius: 2px;
      padding: 17px 36px;
      margin-top: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: .55; }
    .lf-err { color: #9a3b2f; font-size: 13px; margin-top: 12px; display: none; }
    .back { display: inline-block; margin-top: 28px; font-size: 14px; }
    @media (max-width: 640px) { .lf-row { grid-template-columns: 1fr; } }
  </style>
  <script src="/assets/meta-pixel.js" defer></script>
</head>
<body>
  <main>
    <h1>Send an inquiry</h1>
    <p class="sub">One short form — we'll review it and get back to you.</p>
    <form id="leadForm" novalidate>
      <input type="checkbox" name="botcheck" class="lf-hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="lf-row">
        <div class="lf-field">
          <label for="lf-name">Name</label>
          <input id="lf-name" type="text" name="name" placeholder="Your name" autocomplete="name" required />
        </div>
        <div class="lf-field">
          <label for="lf-biz">Business</label>
          <input id="lf-biz" type="text" name="business" placeholder="Business name" autocomplete="organization" required />
        </div>
        <div class="lf-field">
          <label for="lf-email">Email</label>
          <input id="lf-email" type="email" name="email" placeholder="you@business.com" autocomplete="email" required />
        </div>
        <div class="lf-field">
          <label for="lf-phone">Phone</label>
          <input id="lf-phone" type="tel" name="phone" placeholder="(000) 000-0000" autocomplete="tel" required />
        </div>
        <div class="lf-field full">
          <label for="lf-goal">What are you trying to grow?</label>
          <textarea id="lf-goal" name="message" placeholder="A line or two — more calls, booked jobs, a launch, whatever's on your mind." required></textarea>
        </div>
      </div>
      <button type="submit" id="lfBtn"><span id="lfBtnText">Send it over →</span></button>
      <p class="lf-err" id="lfErr">Something went wrong. Email <a href="mailto:evan@rushesmedia.com">evan@rushesmedia.com</a> directly.</p>
    </form>
    <a class="back" href="/">← Back to rushesmedia.com</a>
  </main>
  <script>
    (function () {
      const form = document.getElementById('leadForm');
      const btn = document.getElementById('lfBtn');
      const btnText = document.getElementById('lfBtnText');
      const err = document.getElementById('lfErr');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.style.display = 'none';
        if (!form.checkValidity()) { form.reportValidity(); return; }
        btn.disabled = true;
        btnText.textContent = 'Sending…';
        const fd = new FormData(form);
        try {
          const res = await fetch('/api/lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              niche: 'inquire',
              name: fd.get('name'),
              business: fd.get('business'),
              phone: fd.get('phone'),
              email: fd.get('email'),
              need: fd.get('message'),
              source_url: location.href,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) window.location.href = '/thanks/';
          else throw new Error(data.error || 'submit failed');
        } catch (_) {
          err.style.display = 'block';
          btn.disabled = false;
          btnText.textContent = 'Send it over →';
        }
      });
    })();
  </script>
</body>
</html>
