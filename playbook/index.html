<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) — GA4, suppressed on local hosts -->
<script>
  (function () {
    var host = window.location.hostname.toLowerCase();
    if (['localhost', '127.0.0.1', '[::1]'].includes(host) || host.endsWith('.test')) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-86B4B79T54';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', 'G-86B4B79T54');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get the scorecard — Rushes Media</title>
  <meta name="description" content="{{COPY_META_DESCRIPTION}}" />
  <meta name="theme-color" content="#0c1825" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0c1825;
      color: #f5f0e6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --gold: #b89860;
      --gold-d: #9a7d4a;
      --px: clamp(24px, 6vw, 80px);
      --ease: cubic-bezier(.4,0,.2,1);
    }
    header {
      padding: 28px var(--px);
      display: flex;
      justify-content: center;
    }
    .logo img {
      height: 36px;
      width: auto;
      filter: brightness(0) invert(1) brightness(.96) sepia(.08);
    }
    .logo .wm { height: 22px; margin-left: 10px; }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 var(--px) 80px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 12px;
    }
    h1 em { font-style: italic; color: var(--gold); }
    .sub {
      color: rgba(245,240,230,.72);
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    form { display: grid; gap: 18px; }
    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      letter-spacing: .04em;
      color: rgba(245,240,230,.75);
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 2px;
      border: 1px solid rgba(245,240,230,.18);
      background: rgba(26,42,63,.55);
      color: #f5f0e6;
      font: inherit;
    }
    @media (max-width: 760px) {
      input, select { font-size: 16px; }
      .sub { font-size: 16px; }
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #d4b87a;
      outline-offset: 4px;
    }
    select option { color: #0c1825; }
    .btn {
      margin-top: 8px;
      padding: 16px 24px;
      border: none;
      border-radius: 2px;
      background: var(--gold);
      color: #0c1825;
      font: inherit;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s var(--ease), transform .2s;
    }
    .btn:hover { background: var(--gold-d); transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: wait; transform: none; }
    .err {
      display: none;
      padding: 12px 14px;
      border: 1px solid rgba(220,80,80,.5);
      color: #ffb4b4;
      font-size: 14px;
    }
    .err.on { display: block; }
    .marketing-consent {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      color: rgba(245,240,230,.74);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      text-transform: none;
      letter-spacing: 0;
    }
    .marketing-consent input {
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      accent-color: var(--gold);
    }
    footer {
      text-align: center;
      padding: 30px var(--px);
      font-size: 12px;
      color: rgba(245,240,230,.32);
    }
  </style>
  <link rel="stylesheet" href="/assets/interaction.css" />
</head>
<body>
  <header>
    <a href="/" class="logo" aria-label="Rushes Media — home">
      <img src="../assets/images/logo-icon.png" alt="" width="833" height="959" />
      <img src="../assets/images/logo-wordmark.png" alt="Rushes Media" class="wm" width="2888" height="322" />
    </a>
  </header>

  <main>
    <p class="eyebrow">{{COPY_EYEBROW}}</p>
    <h1>{{COPY_HEADLINE_LEAD}} <em>{{COPY_HEADLINE_ACCENT}}</em></h1>
    <p class="sub">{{COPY_BODY}}</p>

    <div id="err" class="err" role="alert"></div>

    <noscript>
      <style>#form { display: none; }</style>
      <p>To request the scorecard without JavaScript, <a href="mailto:evan@rushesmedia.com?subject=Local%20lead%20leak%20scorecard">email Evan</a>.</p>
    </noscript>
    <form id="form" method="post" action="/api/playbook-capture">
      <input type="hidden" name="src" id="src" value="ig-growth" />

      <label>First name *
        <input name="firstName" maxlength="200" required autocomplete="given-name" />
      </label>

      <label>Email *
        <input name="email" maxlength="254" type="email" required autocomplete="email" />
      </label>

      <label>Business name
        <input name="businessName" maxlength="200" autocomplete="organization" />
      </label>

      <label>Website or Instagram
        <input name="website" maxlength="300" autocomplete="url" placeholder="yoursite.com or @yourhandle" />
      </label>

      <label>Business type *
        <select name="businessType" required>
          <option value="">Select…</option>
          <option>Home services / trades</option>
          <option>Food & hospitality</option>
          <option>Retail / shop</option>
          <option>Other owner-operated</option>
        </select>
      </label>

      <label>Main goal right now *
        <select name="mainGoal" required>
          <option value="">Select…</option>
          <option>More calls / estimates</option>
          <option>Ads that work</option>
          <option>Consistent posting</option>
          <option>Not sure yet</option>
        </select>
      </label>

      <label class="marketing-consent">
        <input type="checkbox" name="marketingConsent" value="true" />
        <span>Send me occasional Rushes follow-up and marketing emails related to this scorecard. This is optional, and I can unsubscribe at any time.</span>
      </label>

      <button class="btn" type="submit" id="submit">{{COPY_PRIMARY_CTA}}</button>
    </form>
  </main>

  <footer>© 2026 Rushes Media · rushesmedia.com</footer>

  <script src="/assets/meta-pixel.js" defer></script>
  <script src="/assets/form-runtime.js" defer></script>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    if (src === 'ig-playbook' || src === 'ig-growth') {
      document.getElementById('src').value = src;
    }

    const form = document.getElementById('form');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('on');

      const formData = new FormData(form);
      const data = {
        ...Object.fromEntries(formData),
        marketingConsent: formData.get('marketingConsent') === 'true',
      };
      await window.RushesForms.submit({ form, endpoint: '/api/playbook-capture', payload: data,
        message: err, destination: '/playbook-thanks/', source: 'playbook:' + data.src });
    });
  </script>
</body>
</html>
